name: Site checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check worker/index.js
      - run: node --check worker/content.js
      - run: node scripts/check-site.mjs
      - run: node scripts/build.mjs
      - run: node scripts/validate-artifact.mjs
